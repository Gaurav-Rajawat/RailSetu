version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: railsetu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railmantri2026}
      POSTGRES_DB: railsetu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railsetu"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railsetu_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-railmantri2026}@db:5432/railsetu
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  admin:
    build:
      context: ./Admin
      dockerfile: Dockerfile
    container_name: railsetu_admin
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
